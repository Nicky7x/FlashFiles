name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q FlashFacil.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compilar Heimdall nativo
        working-directory: FlashFacil
        run: bash tools/build_heimdall.sh
      - name: Compilar APK
        working-directory: FlashFacil
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FlashFacil-apk
          path: FlashFacil/app/build/outputs/apk/debug/*.apk
