name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$Z" ]; then unzip -q "$Z"; fi
          test -d FlashFacil
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx3g\n' > FlashFacil/gradle.properties
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compilar Heimdall nativo
        working-directory: FlashFacil
        run: bash tools/build_heimdall.sh
      - name: Compilar APK
        working-directory: FlashFacil
        run: gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tail -n 120
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: FlashFacil-apk
          path: FlashFacil/app/build/outputs/apk/debug/*.apk
