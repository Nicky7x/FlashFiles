name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: |
          Z=$(ls *.zip 2>/dev/null | head -n1 || true)
          if [ -n "$Z" ]; then unzip -q "$Z"; fi
          test -d FlashFacil
          printf 'android.useAndroidX=true\nandroid.nonTransitiveRClass=true\norg.gradle.jvmargs=-Xmx3g\n' > FlashFacil/gradle.properties
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Corrigir dependencia Activity Result
        working-directory: FlashFacil
        run: |
          if [ -f app/build.gradle.kts ]; then
            printf '\ndependencies { implementation("androidx.activity:activity-ktx:1.9.3") }\n' >> app/build.gradle.kts
          elif [ -f app/build.gradle ]; then
            printf "\ndependencies { implementation 'androidx.activity:activity-ktx:1.9.3' }\n" >> app/build.gradle
          else
            echo "Arquivo Gradle do app nao encontrado"
            exit 1
          fi
      - name: Corrigir import ActivityResultContracts
        working-directory: FlashFacil
        run: |
          FILE=app/src/main/java/com/flashfacil/app/MainActivity.kt
          test -f "$FILE"
          echo "Antes:"
          grep -n 'ActivityResultContracts' "$FILE" || true
          sed -i 's/androidx\.activity\.contract\.ActivityResultContracts/androidx.activity.result.contract.ActivityResultContracts/g' "$FILE"
          echo "Depois:"
          grep -n 'ActivityResultContracts' "$FILE" || true
      - name: Compilar Heimdall nativo
        working-directory: FlashFacil
        run: bash tools/build_heimdall.sh
      - name: Compilar APK
        working-directory: FlashFacil
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$RUNNER_TEMP/flashfacil-gradle.log"
        shell: bash
      - name: Salvar log da compilacao
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FlashFacil-build-log
          path: ${{ runner.temp }}/flashfacil-gradle.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: FlashFacil-apk
          path: FlashFacil/app/build/outputs/apk/debug/*.apk
